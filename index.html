table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:right;vertical-align:top}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

function pagerList(L,pre,id){const i=L.findIndex(x=>x.id===id),p=L[i-1],n=L[i+1];
 return `<div class="pager">${p?`<a class="btn" href="#${pre+p.id}"><small>הקטגוריה הקודמת</small>→ ${p.n}</a>`:`<a class="btn" href="#method"><small>הקודם</small>→ איך עובדים</a>`}${n?`<a class="btn" href="#${pre+n.id}"><small>הקטגוריה הבאה</small>${n.n} ←</a>`:`<a class="btn" href="#all"><small>הבא</small>כל הפעילויות ←</a>`}</div>`;}
function pagerAct(a){const L=actsOf(a.c),i=L.indexOf(a),p=L[i-1],n=L[i+1];
 return `<div class="pager">${p?`<a class="btn" href="#a-${p.id}"><small>הפעילות הקודמת</small>→ ${p.n}</a>`:`<a class="btn" href="#c-${a.c}"><small>חזרה לקטגוריה</small>→ ${CX[a.c].n}</a>`}${n?`<a class="btn" href="#a-${n.id}"><small>הפעילות הבאה</small>${n.n} ←</a>`:`<a class="btn" href="#c-${a.c}"><small>חזרה לקטגוריה</small>${CX[a.c].n} ←</a>`}</div>`;}

const nav=document.getElementById('navlist');
nav.innerHTML=`<li><a href="#home"><span class="code">◎</span>פתיחה</a></li><li><a href="#method"><span class="code">⟳</span>איך עובדים</a></li>
<li class="navgroup">קטגוריות</li>${CATS.map((c,i)=>`<li><a href="#c-${c.id}"><span class="code">${i+1}</span>${c.n}</a></li>`).join('')}
<li class="navgroup">עוד</li><li><a href="#all"><span class="code">☰</span>כל הפעילויות</a></li><li><a href="#sources"><span class="code">§</span>מקורות</a></li>`;

const view=document.getElementById('view');
function route(scroll=true){
 let h=(location.hash||'#home').slice(1);if(!V[h])h='home';
 view.innerHTML=V[h]();document.title=(h==='home'?'':(view.querySelector('h1')?.textContent+' · '))+'מיומנויות קטנות לחיים גדולים';
 const cur=h.startsWith('a-')?'c-'+AX[h.slice(2)].c:h;
 nav.querySelectorAll('a').forEach(a=>a.getAttribute('href')==='#'+cur?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 view.querySelectorAll('[data-age]').forEach(b=>b.addEventListener('click',()=>{st.age=+b.dataset.age;ls.set('gm-age',st.age);route(false);}));
 view.querySelectorAll('[data-fc]').forEach(b=>b.addEventListener('click',()=>{st.fc=b.dataset.fc;route(false);}));
 view.querySelectorAll('[data-ft]').forEach(b=>b.addEventListener('click',()=>{st.ft=b.dataset.ft;route(false);}));
 if(h.startsWith('a-')){const id=h.slice(2),sv=document.getElementById('saved');let tm;
  view.querySelectorAll('textarea').forEach(t=>t.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{const o={};view.querySelectorAll('textarea').forEach(x=>o[x.dataset.k]=x.value);ls.set('gm-n-'+id,JSON.stringify(o));sv.textContent='נשמר';},400);}));}
 if(scroll){view.focus({preventScroll:true});if(location.hash)view.scrollIntoView({block:'start'});}
}
const tg=document.getElementById('navtoggle');
tg.addEventListener('click',()=>{const open=nav.classList.toggle('closed')===false;tg.setAttribute('aria-expanded',open);tg.textContent=open?'הסתר את תוכן העניינים':'הצג את תוכן העניינים';});
nav.addEventListener('click',e=>{if(e.target.closest('a')&&innerWidth<=880){nav.classList.add('closed');tg.setAttribute('aria-expanded','false');tg.textContent='הצג את תוכן העניינים';}});
document.documentElement.dir='rtl';document.documentElement.lang='he';
addEventListener('hashchange',()=>route());route(false);
</script>
